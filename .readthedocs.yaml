version: "2"

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    post_system_dependencies:
      - asdf plugin add java
      - asdf install java latest:adoptopenjdk-11
      - asdf global java latest:adoptopenjdk-11

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev

sphinx:
  configuration: docs/source/conf.py