version: "2"

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.10"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest

    install:
      - pixi install -e gh-actions --locked

    build:
      html:
        - pixi run -e gh-actions --locked sphinx-build -T -b html docs/source $READTHEDOCS_OUTPUT/html