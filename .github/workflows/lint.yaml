name: Lint

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          pip install numpy
          pip install .[dev]
      - name: Perform ruff
        run: |
          ruff check
          ruff format --check