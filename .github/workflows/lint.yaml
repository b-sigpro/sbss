name: Lint

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions
      - name: Perform ruff
        run: |
          pixi run -e gh-actions ruff check
          pixi run -e gh-actions ruff format --check
