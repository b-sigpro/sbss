line-length = 120
target-version = "py310"
exclude = ["sbss/third/"]

[lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["B905"]

[lint.isort]
force-sort-within-sections = true

section-order = [
    "future",
    "typing",
    "standard-library",
    "utilities",
    "datascience",
    "torch",
    "torch-third-party",
    "third-party",
    "audio",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
typing = ["typing"]
utilities = ["progressbar", "omegaconf", "hydra"]
datascience = ["numpy", "scipy", "pandas", "matplotlib", "opt_einsum", "einops"]
torch = ["torch"]
torch-third-party = [
    "torchaudio",
    "torchvision",
    "auraloss",
    "lightning",
    "einops.layers",
]
audio = ["librosa", "pypesq", "pystoi", "soundfile"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
