[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sbss-toolkit"
authors = [{ name = "Yoshiaki Bando", email = "y.bando@aist.go.jp" }]
readme = "README.md"
license = { file = "LICENSE" }
description = "Scalable Blind Source Separation Toolkit"

dependencies = [
    "aiaccel>=2026.6.0",
    "einops",
    "hydra-core",
    "kornia",
    "librosa",
    "lightning",
    "matplotlib",
    "natsort",
    "numpy",
    "omegaconf>=2.4.0",
    "pyyaml",
    "resampy",
    "rich",
    "rotary-embedding-torch>=0.8.9",
    "soundfile",
    "scipy",
    "torch",
    "torchaudio",
    "torchmetrics",
    "torchvision",
]

dynamic = ["version"]

[tool.hatch.version]
source = "vcs"

[project.urls]
Home = "https://ybando.jp"

[tool.hatch.build.targets.wheel]
packages = ["sbss"]