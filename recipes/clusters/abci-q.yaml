_base_: "${resolve_pkg_path:aiaccel.job.apps.config}/pbs.yaml"

script_prologue: |
  echo Job ID: $PBS_JOBID
  echo Hostname: $(hostname)

  export PATH="$HOME/.pixi/bin:$PATH"
  export CUDA_VISIBLE_DEVICES=0,1,2,3

  eval "$(pixi shell-hook --as-is)"

  export COLUMNS=120
  export PYTHONUNBUFFERED=true

qsub: "qsub -W group_list=$JOB_GROUP -l walltime={args.walltime} -r y -l USE_SSH=1"

cpu:
  qsub_args: "-l rt_QF=1"
  job: "direnv exec . {command}"
  
cpu-array:
  n_tasks_per_proc: 128
  n_procs: 24
  qsub_args: "-l rt_QF=1 -J 1-{args.n_tasks}:$(( {args.n_tasks_per_proc} * {args.n_procs} ))"
  job: "direnv exec . {command}"
  
gpu:
  qsub_args: "-l rt_QF=1"
  job: "direnv exec . {command}"
  
gpu-array:
  n_tasks_per_proc: 128
  n_procs: 4
  qsub_args: "-l rt_QF=1 -J 1-{args.n_tasks}:$(( {args.n_tasks_per_proc} * {args.n_procs} ))"
  job: "CUDA_VISIBLE_DEVICES=$(( LOCAL_PROC_INDEX % 4 )) direnv exec . {command}"

mpi:
  n_nodes: 1
  qsub_args: >-
      -l rt_QF={args.n_nodes}:mpiprocs=$(( {args.n_procs} / {args.n_nodes} ))
  job: |
    source /etc/profile.d/modules.sh
    module load openmpi/4.1.7

    mpirun -np {args.n_procs} -bind-to none -map-by slot \
        direnv exec . {command}

train:
  qsub_args: >-
      -l $( (({args.n_gpus}==1)) && printf rt_QG || printf rt_QF )=$(( ({args.n_gpus} + 3) / 4 )):mpiprocs=$( (({args.n_gpus}==1)) && printf 1 || printf 4 )
  job: |
    source /etc/profile.d/modules.sh
    module load openmpi/4.1.7

    mpirun -np {args.n_gpus} -bind-to none -map-by slot \
        -x MAIN_ADDR=$(hostname -i) \
        -x MAIN_PORT=3000 \
        -x COLUMNS=120 \
        -x PYTHONUNBUFFERED=true \
        -x NCCL_DEBUG=INFO \
        -x NCCL_DEBUG_SUBSYS=INIT,GRAPH,NET \
        -x NCCL_DEBUG_FILE=/tmp/nccl.%h.%p.log \
        direnv exec . {command}