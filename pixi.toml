[workspace]
channels = []
platforms = ["linux-64"]
exclude-newer = "14d"

[pypi-exclude-newer]
aiaccel = "0d"

[environments]
default = { features = ["gpu", "system-mpi"], solve-group = "default" }
gh-actions = { features = ["cpu", "conda-mpi"], solve-group = "gh-actions" }

[tasks]

[dependencies]
python = ">=3.10,<3.15"
openjdk = "*"
blas = { version = "*", build = "mkl" }
setuptools = "<82"
hatch = "*"

# build tools
make = ">=4.4"
cmake = "*"
pre-commit = "*"
ruff = "*"

# mpi
openmpi = { version = "4.1.*" }
hdf5 = { version = "*", build = "mpi_openmpi*" }
h5py = { version = "*", build = "mpi_openmpi*" }
mpi4py = "*"

# multimedia tools
sox = "*"
ffmpeg = ">=8.0.0"

# dev tools
direnv = "*"
byobu = "*"
tmux = "<3.6"
procps-ng = ">=4.0.4,<5"

ipython = "*"
jupyter = "*"
tensorboard = "*"
tensorboard-data-server = "*"
optuna = ">=4.5.0"
pandas = "*"
markdown-it-py = ">=3.0,<4.0"

[pypi-dependencies]
sbss-toolkit = { path = ".", editable = true }

mir_eval = "*"
pesq = "*"
pystoi = "*"

myst-parser = "*"
sphinx = "*"
sphinxcontrib-jquery = "*"
sphinx-intl = "*"
sphinx-fontawesome = "*"
sphinx-rtd-theme = "*"
sphinx-copybutton = "*"
sphinx-autobuild = "*"
sphinx_design = "*"
shibuya = "*"
speechbrain = ">=1.1.0, <2"
umap-learn = ">=0.5.12, <0.6"
pytorch-pfn-extras = ">=0.9.0, <0.10"
openai-whisper = ">=20250625, <20250626"
meeteval = ">=0.4.3, <0.5"
simplejson = ">=4.1.1, <5"

# conda-mpi
[feature.conda-mpi]
channels = ["conda-forge"]

# system-mpi
[feature.system-mpi]
channels = ["conda-forge/label/mpi-external", "conda-forge"]

# gpu
[feature.gpu.dependencies]
cuda-version = "12.9.*"
cuda = "*"

gcc_linux-64 = "13.*"
gxx_linux-64 = "13.*"

[feature.gpu.pypi-dependencies]
torch = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cu129" }
torchvision = { version = "==0.26.*", index = "https://download.pytorch.org/whl/cu129" }
torchaudio = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cu129" }

cupy-cuda12x = "*"
wpe-gpu = { git = "https://github.com/desh2608/wpe" }
gpuRIR = { git = "https://github.com/DavidDiazGuerra/gpuRIR" }

[feature.gpu.pypi-options]
no-build-isolation = ["gpuRIR"]
no-binary = ["gpuRIR"]

# cpu
[feature.cpu.pypi-dependencies]
torch = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.26.*", index = "https://download.pytorch.org/whl/cpu" }
torchaudio = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cpu" }
